name: flutter_application_1
description: GeoRoute starter app
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.0
  flutter_svg: ^2.0.0
  flutter_map: ^8.2.2  
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  file_saver: ^0.3.1
  pdf: ^3.10.4
  excel: ^4.0.0
  supabase_flutter: ^2.12.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  http: ^1.2.0
  flutter_rating_bar: ^4.0.1
  connectivity_plus: ^7.0.0         
  fluttertoast: ^9.0.0
  image_picker: ^1.0.0 
  image_picker_web: ^4.0.0        # for picking images from gallery/camera
  path: ^1.8.0                  # for file paths
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/7seas.jpg
    - assets/icon/